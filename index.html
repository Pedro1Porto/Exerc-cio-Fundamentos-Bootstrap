<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="bg-primary p-3 m-3 rounded-4">
        <h1 class="d-flex justify-content-center mb-3 display-5 fw-bold">Cadastre-se</h1>
        <div class="dropdown-center">
            <form class="bg-info p-3 rounded shadow-lg border border-dark border-opacity-50">
                <label for="nome" class="form-label lead">Seu Nome:</label>
                <input type="nome" id="nome" class="fs-5 fw-light form-control bg-primary border border-white text-white placeholder-wave" placeholder="Nome completo">

                <label for="email" class="form-label lead mt-2 ">Seu Email:</label>
                <input type="email" id="email" class="fs-5 fw-light form-control bg-primary border border-white text-white placeholder-wave" placeholder="email@exemplo.com">

                <label for="tel" class="form-label lead mt-2 ">Seu Telefone:</label>
                <input type="tel" id="tel" class="fs-5 fw-light form-control bg-primary border border-white text-white placeholder-wave" placeholder="(DDD) 12345-1234">

                <a href="#" class="fs-4 btn btn-dark border border-white mt-3 d-block text-center justify-content-center">Enviar Cadastro !</a>
            </form>
        </div>
    </div>
    <script src="./main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
